site_name: ShadowData
site_description: A Python library for anonymizing, masking, and encrypting sensitive data.
site_url: https://spacexnu.github.io/ShadowData/
repo_url: https://github.com/spacexnu/ShadowData
repo_name: spacexnu/ShadowData
edit_uri: edit/main/docs/
copyright: Released under the MIT License.

theme:
  name: material
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Choosing a technique: guide/choosing.md
      - Anonymization: guide/anonymization.md
      - Localized identifiers: guide/identifiers.md
      - Masking: guide/masking.md
      - Pseudonymization: guide/pseudonymization.md
      - Encryption: guide/encryption.md
      - PII detection: guide/pii-detection.md
  - API reference: reference.md
  - Contributing: contributing.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ['.']
      check_paths: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/spacexnu/ShadowData
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/shadow-data/
